<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anderson Dining</title>
<meta name="description" content="Today's Vanderbilt campus dining menus, in one place." />
<script>try{var t=localStorage.getItem('dining-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#faf9f4; --surface:#fffefb; --sunken:#f2efe7; --text:#1a1a17; --muted:#6e6e66;
    --faint:#a0a097; --border:#e9e6dd; --border-hov:#d4d0c4;
    --accent:#a68b2c; --accent-soft:#f5efd8; --on-accent:#fcfcfb;
    --veg:#2f8f55; --alrt:#c0532c; --maxw:1080px;
    --spectrum:linear-gradient(90deg,#c9a227,#2f8f55,#3f6dc7,#7d5bc0,#c94f93,#2f8f8f);
  }
  [data-theme="dark"] {
    --bg:#131312; --surface:#1c1c1a; --sunken:#232320; --text:#ededea; --muted:#8a8a81;
    --faint:#5c5c54; --border:#272724; --border-hov:#3a3a35;
    --accent:#d4b64a; --accent-soft:#2a2418; --on-accent:#131312;
    --veg:#5cc483; --alrt:#e08a5f;
    --spectrum:linear-gradient(90deg,#d4b64a,#5cc483,#7aa0e8,#a98fe0,#e589c0,#5ec0c0);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,system-ui,sans-serif; font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background .35s ease,color .35s ease;
  }
  body::before { content:""; position:fixed; top:0; left:0; right:0; height:3px;
    background:var(--spectrum); z-index:50; }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px 90px; }

  /* Masthead */
  header.mast { padding:34px 0 18px; border-bottom:1px solid var(--border); }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .transmit { display:flex; align-items:center; gap:8px; font-family:"Space Mono",monospace;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent);
    animation:pulse 2.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(166,139,44,.4);} 70%{box-shadow:0 0 0 6px rgba(166,139,44,0);} 100%{box-shadow:0 0 0 0 rgba(166,139,44,0);} }
  .btn-ghost { font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); background:transparent; border:1px solid var(--border);
    border-radius:100px; padding:6px 12px; cursor:pointer;
    transition:border-color .15s,color .15s,background .15s; }
  .btn-ghost:hover { border-color:var(--border-hov); color:var(--text); }
  .btn-ghost:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  h1.title { font-family:"Fraunces",Georgia,serif; font-weight:600; font-optical-sizing:auto;
    font-size:clamp(32px,5.2vw,48px); line-height:1.02; letter-spacing:-.018em;
    margin:18px 0 12px; text-align:center; }
  h1.title .glow { color:var(--accent); }
  .dash { display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:6px 14px; font-family:"Space Mono",monospace; font-size:11.5px; color:var(--faint); }
  .dash b { color:var(--text); font-weight:700; }

  /* Filters */
  .filters { margin:22px 0 4px; display:flex; flex-direction:column; gap:12px; }
  .frow { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .flabel { font-family:"Space Mono",monospace; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--faint); min-width:74px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12.5px; color:var(--muted); background:transparent;
    border:1px solid var(--border); border-radius:100px; padding:5px 12px; cursor:pointer;
    transition:border-color .15s,color .15s,background .15s; }
  .chip:hover { border-color:var(--border-hov); color:var(--text); }
  .chip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .chip[aria-pressed="true"] { background:var(--text); border-color:var(--text); color:var(--bg); }
  .chip.exclude[aria-pressed="true"] { background:var(--alrt); border-color:var(--alrt); color:#fff; }
  .search { flex:1; min-width:200px; font:inherit; font-size:13.5px; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:100px;
    padding:7px 14px; }
  .search:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .hint { font-size:11.5px; color:var(--faint); }

  /* Hall cards */
  .halls { margin-top:26px; display:flex; flex-direction:column; gap:16px; }
  .hall { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    overflow:hidden; }
  .hall-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 20px; cursor:pointer; user-select:none; }
  .hall-head:hover { background:var(--sunken); }
  .hall-name { font-family:"Fraunces",Georgia,serif; font-size:19px; font-weight:600;
    letter-spacing:-.01em; }
  .hall-meta { font-family:"Space Mono",monospace; font-size:11px; color:var(--faint);
    display:flex; align-items:center; gap:10px; }
  .status { font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    border-radius:100px; padding:3px 9px; border:1px solid var(--border); }
  .status.open { color:var(--veg); border-color:currentColor; }
  .status.closed { color:var(--faint); }
  .hall-body { border-top:1px solid var(--border); padding:4px 20px 18px; }
  .hall[data-open="false"] .hall-body { display:none; }
  .caret { transition:transform .2s ease; display:inline-block; }
  .hall[data-open="true"] .caret { transform:rotate(90deg); }

  .meal { padding-top:14px; }
  .meal-head { font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .cat { margin:10px 0 0; }
  .cat-name { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  ul.items { list-style:none; margin:0; padding:0; }
  li.item { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px;
    padding:5px 0; border-bottom:1px dashed var(--border); }
  li.item:last-child { border-bottom:none; }
  .item-name { font-size:14px; }
  .serving { font-family:"Space Mono",monospace; font-size:10.5px; color:var(--faint); }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-left:auto; }
  .tag { font-size:10px; letter-spacing:.04em; color:var(--muted);
    background:var(--sunken); border-radius:100px; padding:2px 8px; white-space:nowrap; }
  .tag.good { color:var(--veg); background:transparent; border:1px solid currentColor; }

  .empty { text-align:center; color:var(--faint); padding:48px 0; font-size:14px; }
  footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--border);
    font-family:"Space Mono",monospace; font-size:11px; color:var(--faint); text-align:center; }
  footer a { color:var(--muted); }
  @media (max-width:560px) {
    .flabel { min-width:100%; }
    .tags { margin-left:0; width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="topbar">
      <div class="transmit"><span class="dot"></span><span id="stamp">loading…</span></div>
      <button class="btn-ghost" id="theme" type="button">Dark</button>
    </div>
    <h1 class="title">Anderson <span class="glow">Dining</span></h1>
    <div class="dash" id="dash"></div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="frow">
      <span class="flabel">Day</span>
      <div class="chips" id="f-date"></div>
    </div>
    <div class="frow">
      <span class="flabel">Meal</span>
      <div class="chips" id="f-meal"></div>
    </div>
    <div class="frow">
      <span class="flabel">Only show</span>
      <div class="chips" id="f-include"></div>
    </div>
    <div class="frow">
      <span class="flabel">Hide</span>
      <div class="chips" id="f-exclude"></div>
    </div>
    <div class="frow">
      <span class="flabel">Search</span>
      <input class="search" id="q" type="search" placeholder="chicken, tofu, waffle…" />
    </div>
    <div class="frow"><span class="flabel"></span><span class="hint" id="hint"></span></div>
  </section>

  <main class="halls" id="halls"></main>
  <div class="empty" id="empty" hidden>Nothing matches those filters.</div>

  <footer>
    Scraped from <a id="src" href="#">Vanderbilt NetNutrition</a> · updates a few times a day ·
    always confirm allergens with dining staff.
  </footer>
</div>

<script>
const state = { data:null, date:null, meal:null, include:new Set(), exclude:new Set(), q:"" };

// Tags that read as "I want this" rather than "this contains an allergen".
const POSITIVE = new Set(["Vegetarian","Vegan","Halal","Kosher","Features Local Ingredient"]);

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dayLabel(iso, today) {
  const d = new Date(iso + "T12:00:00");
  if (iso === today) return "Today";
  const t = new Date(today + "T12:00:00");
  if ((d - t) / 86400000 === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}

function chip(text, pressed, onClick, extraClass) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (extraClass ? " " + extraClass : "");
  b.textContent = text;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.addEventListener("click", onClick);
  return b;
}

function renderFilters() {
  const d = state.data;
  const dates = [...new Set(d.menus.map(m => m.date))].sort();
  const meals = [...new Set(d.menus.map(m => m.meal))];
  meals.sort((a, b) => (d.meal_order.indexOf(a) + 99) % 99 - (d.meal_order.indexOf(b) + 99) % 99);

  const fd = $("f-date"); fd.innerHTML = "";
  dates.forEach(dt => fd.appendChild(
    chip(dayLabel(dt, d.campus_date), state.date === dt, () => { state.date = dt; render(); })));

  const fm = $("f-meal"); fm.innerHTML = "";
  fm.appendChild(chip("All", state.meal === null, () => { state.meal = null; render(); }));
  meals.forEach(ml => fm.appendChild(
    chip(ml, state.meal === ml, () => { state.meal = ml; render(); })));

  const positives = d.tags.filter(t => POSITIVE.has(t));
  const allergens = d.tags.filter(t => !POSITIVE.has(t));

  const fi = $("f-include"); fi.innerHTML = "";
  positives.forEach(t => fi.appendChild(chip(t, state.include.has(t), () => {
    state.include.has(t) ? state.include.delete(t) : state.include.add(t); render();
  })));

  const fe = $("f-exclude"); fe.innerHTML = "";
  allergens.forEach(t => fe.appendChild(chip(t, state.exclude.has(t), () => {
    state.exclude.has(t) ? state.exclude.delete(t) : state.exclude.add(t); render();
  }, "exclude")));
}

function itemPasses(item) {
  // "Only show" is an AND: an item must carry every requested trait.
  for (const t of state.include) if (!item.tags.includes(t)) return false;
  for (const t of state.exclude) if (item.tags.includes(t)) return false;
  if (state.q && !item.name.toLowerCase().includes(state.q)) return false;
  return true;
}

function render() {
  const d = state.data;
  renderFilters();

  const halls = $("halls");
  const openHalls = new Set(
    [...halls.querySelectorAll('.hall[data-open="true"]')].map(el => el.dataset.hall));
  halls.innerHTML = "";

  let shownItems = 0, shownHalls = 0;

  for (const hall of d.halls) {
    const menus = d.menus.filter(m =>
      m.hall === hall.name &&
      m.date === state.date &&
      (state.meal === null || m.meal === state.meal));
    if (!menus.length) continue;

    // Filter down to what survives the tag/search filters before drawing.
    const kept = menus.map(m => ({
      meal: m.meal,
      categories: m.categories
        .map(c => ({ name:c.name, items:c.items.filter(itemPasses) }))
        .filter(c => c.items.length)
    })).filter(m => m.categories.length);
    if (!kept.length) continue;

    const count = kept.reduce((n, m) =>
      n + m.categories.reduce((k, c) => k + c.items.length, 0), 0);
    shownItems += count; shownHalls++;

    const el = document.createElement("section");
    el.className = "hall";
    el.dataset.hall = hall.name;
    // Default: expand everything when a filter is narrowing results, otherwise
    // keep whatever the reader had open.
    const filtering = state.q || state.include.size || state.exclude.size;
    el.dataset.open = (filtering || openHalls.has(hall.name)) ? "true" : "false";

    const isOpen = /open/i.test(hall.status || "");
    el.innerHTML =
      `<div class="hall-head" role="button" tabindex="0" aria-expanded="${el.dataset.open}">
         <div class="hall-name"><span class="caret">›</span> ${esc(hall.name)}</div>
         <div class="hall-meta">
           <span>${count} item${count === 1 ? "" : "s"}</span>
           <span class="status ${isOpen ? "open" : "closed"}">${esc(hall.status || "—")}</span>
         </div>
       </div>
       <div class="hall-body">` +
      kept.map(m =>
        `<div class="meal"><div class="meal-head">${esc(m.meal)}</div>` +
        m.categories.map(c =>
          `<div class="cat"><div class="cat-name">${esc(c.name)}</div><ul class="items">` +
          c.items.map(i =>
            `<li class="item"><span class="item-name">${esc(i.name)}</span>` +
            (i.serving_size ? `<span class="serving">${esc(i.serving_size)}</span>` : "") +
            (i.tags.length
              ? `<span class="tags">${i.tags.map(t =>
                  `<span class="tag${POSITIVE.has(t) ? " good" : ""}">${esc(t)}</span>`).join("")}</span>`
              : "") +
            `</li>`).join("") +
          `</ul></div>`).join("") +
        `</div>`).join("") +
      `</div>`;

    const head = el.querySelector(".hall-head");
    const toggle = () => {
      const now = el.dataset.open !== "true";
      el.dataset.open = String(now);
      head.setAttribute("aria-expanded", String(now));
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
    halls.appendChild(el);
  }

  $("empty").hidden = shownHalls > 0;
  $("hint").textContent = `${shownItems} item${shownItems === 1 ? "" : "s"} across ` +
    `${shownHalls} location${shownHalls === 1 ? "" : "s"}`;
}

function boot(d) {
  // meal_order is derived here so the JSON stays purely data.
  d.meal_order = ["Breakfast", "Lunch", "Dinner", "Daily Offerings"];
  state.data = d;
  const dates = [...new Set(d.menus.map(m => m.date))].sort();
  state.date = dates.includes(d.campus_date) ? d.campus_date : dates[0];

  const when = new Date(d.generated_at);
  $("stamp").textContent = "Updated " +
    when.toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
  $("dash").innerHTML =
    `<span><b>${d.halls.filter(h => h.menu_count).length}</b> locations</span>` +
    `<span><b>${d.menu_count}</b> menus</span>` +
    `<span><b>${d.item_count}</b> items</span>`;
  $("src").href = d.source;
  render();
}

$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });

const themeBtn = $("theme");
function paintTheme() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  themeBtn.textContent = dark ? "Light" : "Dark";
}
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("dining-theme", next); } catch (e) {}
  paintTheme();
});
paintTheme();

fetch("menu.json?t=" + Date.now())
  .then(r => r.json())
  .then(boot)
  .catch(err => {
    $("stamp").textContent = "failed to load";
    $("empty").hidden = false;
    $("empty").textContent = "Could not load menu.json — " + err;
  });
</script>
</body>
</html>
