name: Update Dining Menus

on:
  schedule:
    # Eight runs a day, every three hours. Menus themselves only change daily,
    # but each run also backfills a slice of the nutrition cache (see
    # nutrition.py), so more runs means the macro data fills in and stays
    # current faster. Eight is comfortably inside a polite request rate.
    # NOTE: avoid "0 * * * *". The top of the hour is the most congested slot
    # on GitHub's free runners; those jobs get delayed 10-40 min and are
    # sometimes silently dropped. Times below are UTC (Central + 5/6).
    - cron: "23 */3 * * *"   # ~1,4,7,10am / 1,4,7,10pm Central
  workflow_dispatch:

permissions:
  contents: write

# Stop a slow scheduled run and a manual run from clobbering each other.
concurrency:
  group: dining-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A cold nutrition cache makes the first few runs long (a full scrape plus
    # a 400-label backfill is ~8 min). Cap it so a hung request can't burn an
    # hour of the free-tier budget; the next run picks up where this one left off.
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"                      # caches deps across runs (~30s saved)

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape the menus
        run: python main.py

      - name: Commit updated menus
        run: |
          git config user.name "dining-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/menu.json docs/nutrition.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update menus $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Pull first in case a manual run committed while this one worked.
            git pull --rebase origin main || true
            git push
          fi

      - name: Heartbeat
        if: always()
        run: echo "Dining run finished at $(date -u +'%Y-%m-%d %H:%M:%S UTC') — status ${{ job.status }}"
